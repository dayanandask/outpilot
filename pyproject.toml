[project]
name = "outreach-pipeline"
version = "0.1.0"
description = "Subspace Cold Outreach Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "aiosqlite>=0.20.0",
    "sqlmodel>=0.0.16",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "email-validator>=2.1.1",
]

[project.scripts]
pipeline = "pipeline.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.0",
    "mkdocstrings>=0.25.1",
    "mkdocstrings-python>=1.10.2",
    "mkdocs-material>=9.5.21",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

